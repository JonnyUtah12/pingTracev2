name: windows-portable

# Builds the portable Windows folder on a real windows-latest runner,
# smoke-tests the frozen exe through run.bat / stop.bat, and (on a v* tag)
# publishes the zip as a release asset. This is the only supported source of
# pingtrace.exe - end users download the zip and need no Python.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: tests
        shell: bash
        run: timeout 300 python -m pytest tests/ -v

      - name: build portable folder
        run: powershell -ExecutionPolicy Bypass -File packaging\build_portable.ps1

      # Optional code signing via Azure Trusted Signing (~$10/month, removes
      # the SmartScreen "unknown publisher" block and builds real reputation).
      # Enable by creating repo variables TRUSTED_SIGNING_ENDPOINT,
      # TRUSTED_SIGNING_ACCOUNT_NAME, TRUSTED_SIGNING_CERT_PROFILE and
      # secrets AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET (see
      # README "Why Windows flags it"). Skipped entirely when unconfigured.
      - name: code sign pingtrace.exe (only when signing is configured)
        if: vars.TRUSTED_SIGNING_ACCOUNT_NAME != ''
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_CERT_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: dist/pingtrace/pingtrace.exe
          description: PingTrace
          description-url: https://github.com/JonnyUtah12/pingtrace

      - name: smoke test - frozen exe, dashboard, run.bat re-run path, stop.bat
        shell: bash
        run: |
          set -e
          cd dist/pingtrace
          # Start the exe directly (same command run.bat uses). run.bat's cold
          # start via `start /min` cannot survive on the runner: no interactive
          # desktop, so the minimized console is destroyed when the parent cmd
          # exits (observed: health OK, then connection refused 2s later).
          # On a user desktop that window persists.
          ./pingtrace.exe --no-window --port 8765 &
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "FAIL: /api/health never answered"; exit 1; }
          curl -sf http://127.0.0.1:8765/api/health; echo
          curl -sf -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:8765/
          for a in /static/app.js /static/styles.css /static/vendor/chart.umd.min.js; do
            curl -sf -o /dev/null -w "$a -> %{http_code}\n" "http://127.0.0.1:8765$a"
          done
          # run.bat with the server already up: must exit 0 without starting a
          # second instance (health probe short-circuits to opening the browser;
          # the single-instance guard is the backstop).
          cmd //c run.bat
          echo "run.bat (already-running path) exit: $?"
          cmd //c stop.bat
          echo "stop.bat exit: $?"
          sleep 2
          if curl -sf http://127.0.0.1:8765/api/health >/dev/null; then
            echo "FAIL: server still answering after stop.bat"; exit 1
          fi
          echo "port released after stop.bat: OK"
      - name: zip portable folder
        shell: bash
        run: |
          set -e
          # Git Bash on Windows ships no `zip` (exit 127 in run 38505489132).
          # Compress-Archive is in every Windows PowerShell; -Path <dir> puts
          # the folder itself at the zip root, so extracting gives pingtrace/.
          # The smoke test just ran the app, so dist/pingtrace holds its
          # metrics.db; shipped builds must start with an empty history.
          rm -f dist/pingtrace/metrics.db dist/pingtrace/metrics.db-shm dist/pingtrace/metrics.db-wal
          powershell -NoProfile -Command "Compress-Archive -Path dist/pingtrace -DestinationPath pingtrace-windows-x64-portable.zip -Force"
          ls -l pingtrace-windows-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pingtrace-windows-x64-portable
          path: pingtrace-windows-x64-portable.zip

      - name: publish release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" pingtrace-windows-x64-portable.zip \
            --title "PingTrace $GITHUB_REF_NAME (Windows portable)" \
            --notes "Portable multi-target ping plotter for Windows 10/11 x64. Extract the zip, double-click run.bat. No installer, no admin rights, no Python."
